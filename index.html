<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex AI</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --panel-2: #f0f2f7;
        --accent: #f5c518;
        --accent-dark: #dca800;
        --text: #15181f;
        --muted: #667085;
        --border: #e6e8ef;
        --user: #111827;
        --bot: #f7f7f7;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #fffef7 0%, #f6f7fb 100%);
        color: var(--text);
      }

      .app {
        max-width: 820px;
        margin: 40px auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(17, 24, 39, 0.08);
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        background: #fffdf7;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #000;
        font-weight: 800;
      }

      .status-wrap { display: flex; gap: 10px; align-items: center; }

      .status {
        padding: 6px 10px;
        border-radius: 999px;
        background: #fef3c7;
        color: #92400e;
        font-size: 12px;
        font-weight: 700;
      }

      .upgrade-btn {
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--accent);
        border: none;
        cursor: pointer;
        font-weight: 700;
      }

      .upgrade-btn[disabled] { opacity: 0.6; cursor: default; }

      .chat {
        height: 480px;
        overflow-y: auto;
        background: var(--bg);
        padding: 20px;
      }

      .message {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .avatar.bot {
        background: var(--accent);
        color: #000;
      }

      .avatar.user {
        background: #111827;
        color: #fff;
      }

      .bubble {
        max-width: 70%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .message.bot .bubble {
        background: var(--bot);
        border: 1px solid var(--border);
      }

      .message.user .bubble {
        background: var(--user);
        color: white;
      }

      .composer {
        display: flex;
        gap: 10px;
        padding: 16px 20px 20px;
        background: #fff;
        border-top: 1px solid var(--border);
      }

      input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent-dark);
        box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 0 18px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: #000;
      }

      button:hover { background: #ffd234; }

      .note { font-size: 12px; color: var(--muted); margin-top: 6px; }

      /* image preview inside chat */
      .img-preview { max-width: 240px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 6px 18px rgba(0,0,0,0.06); display:block; margin-top:8px; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="brand">
          <div class="brand-mark">F</div>
          <span>Flex AI</span>
        </div>
        <div class="status-wrap">
          <div class="status" id="status">Online</div>
          <button class="upgrade-btn" id="upgradeBtn">Upgrade</button>
          <button class="upgrade-btn" id="uploadBtn">Upload Image</button>
        </div>
      </div>

      <div class="chat" id="chat"></div>

      <form class="composer" id="composer">
        <input id="question" type="text" placeholder="Ask Flex AI anything..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>

      <!-- hidden file input for images -->
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
    </div>

    <script>
      const chat = document.getElementById('chat');
      const questionInput = document.getElementById('question');
      const composer = document.getElementById('composer');
      const upgradeBtn = document.getElementById('upgradeBtn');
      const statusEl = document.getElementById('status');
      const uploadBtn = document.getElementById('uploadBtn');
      const fileInput = document.getElementById('fileInput');

      // PRO state persisted to localStorage so "fake-buy" can't be repeated in the same browser
      let isPro = false;

      function initProState() {
        try {
          const stored = localStorage.getItem('flexai_isPro');
          isPro = stored === '1';
        } catch (e) {
          isPro = false;
        }
        refreshProUI();
      }

      function refreshProUI() {
        if (isPro) {
          statusEl.textContent = 'Pro';
          statusEl.style.background = '#ecfdf5';
          statusEl.style.color = '#065f46';
          upgradeBtn.textContent = 'Pro';
          upgradeBtn.disabled = true;
        } else {
          statusEl.textContent = 'Online';
          statusEl.style.background = '#fef3c7';
          statusEl.style.color = '#92400e';
          upgradeBtn.textContent = 'Upgrade';
          upgradeBtn.disabled = false;
        }
      }

      function addMessage(role, text, opts = {}) {
        const row = document.createElement('div');
        row.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = `avatar ${role}`;
        avatar.textContent = role === 'bot' ? 'F' : 'U';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (opts.html) bubble.innerHTML = text; else bubble.textContent = text;

        if (role === 'user') {
          row.appendChild(bubble);
          row.appendChild(avatar);
        } else {
          row.appendChild(avatar);
          row.appendChild(bubble);
        }

        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        return bubble; // return bubble for attaching extra nodes (like images)
      }

      // Improved getAnswer: handle casual greetings (sup?, what's up?) + math
      function getAnswer(input) {
        const text = input.trim();
        if (!text) return 'Ask me anything.';

        // Normalize: lowercase, strip surrounding punctuation (but keep +), collapse spaces
        const normalized = text
          .toLowerCase()
          .replace(/["'`~()\[\]{}<>:;\\/]/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        // Greeting detection (catch 'sup', "what's up", 'whats up', 'yo', etc.)
        const greetings = ['hello','hi','hey','howdy','hiya','sup','yo','wassup','whats up','what\s+up','what is up','what\'s up'];
        for (const g of greetings) {
          const re = new RegExp('^' + g.replace(/\s+/g, '\\s+') + '(\b|\s|$)');
          if (re.test(normalized)) {
            const replies = [
              "Hey! What's up?",
              'Hi there — how can I help?',
              "Sup? Need anything?",
            ];
            return replies[Math.floor(Math.random() * replies.length)];
          }
        }

        // Simple math: 1+1 variants
        const isSimpleMath = /(^(what'?s?|what is|whats|what\s+is|what\s+are)?\s*1\s*(?:\+|plus)\s*1$)|(^1\s*(?:\+|plus)\s*1\s*=*$)|(^1\s*\+\s*1$)/.test(normalized);
        if (isSimpleMath) {
          return 'The answer is 2! 🔢';
        }

        if (/\b1\s*(?:\+|plus)\s*1\b/.test(normalized)) {
          return 'The answer is 2! 🔢';
        }

        return "Hmm, that one threw me off. What did you mean?";
      }

      composer.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = questionInput.value.trim();
        if (!value) return;

        addMessage('user', value);
        addMessage('bot', getAnswer(value));
        questionInput.value = '';
      });

      // Image upload handling: client-side analysis so it works offline or online
      uploadBtn.addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        addMessage('user', `[image uploaded: ${f.name}]`);
        analyzeImageFile(f);
        e.target.value = '';
      });

      function analyzeImageFile(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataURL = ev.target.result;
          const img = new Image();
          img.onload = () => {
            // basic client-side analysis: dimensions + average color
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            // draw to canvas scaled down for performance
            const max = 200; // sample size
            const sw = Math.min(max, w);
            const sh = Math.min(max, h);
            const c = document.createElement('canvas');
            c.width = sw;
            c.height = sh;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, sw, sh);
            try {
              const id = ctx.getImageData(0,0,sw,sh).data;
              let r=0,g=0,b=0,count=0;
              // sample every 4th pixel for speed
              for (let i=0;i<id.length;i+=16) { r += id[i]; g += id[i+1]; b += id[i+2]; count++; }
              r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
              const avg = `rgb(${r}, ${g}, ${b})`;

              // produce a simple description
              const offlineNote = navigator.onLine ? '' : ' (no internet detected — analysis limited offline)';
              const desc = `I can see you've uploaded an image${offlineNote} — basic client-side analysis:\n- Filename: ${file.name}\n- Dimensions: ${w}×${h}px\n- Approx. average color: ${avg}`;

              const bubble = addMessage('bot', desc.replace(/\n/g,'\n'));
              // attach preview image under the bot bubble
              const imgEl = document.createElement('img');
              imgEl.src = dataURL;
              imgEl.className = 'img-preview';
              bubble.appendChild(imgEl);

            } catch (err) {
              // CORS or security error reading pixels
              const note = navigator.onLine ? '' : ' (no internet detected — analysis limited offline)';
              addMessage('bot', `I can see you've uploaded an image${note}. I couldn't run pixel-level analysis (security/CORS). I can still display the image and you can describe what you'd like me to look for.`);
            }
          };
          img.onerror = () => {
            addMessage('bot', 'Uploaded file is not a valid image.');
          };
          img.src = dataURL;
        };
        reader.readAsDataURL(file);
      }

      // Purchase flow - simple simulated purchase that is idempotent
      function purchasePro() {
        if (isPro) {
          addMessage('bot', "You're already Pro — thanks! 🎉");
          return;
        }

        // Simulate a checkout flow. In a real app you'd call a backend/payment gateway.
        const ok = confirm('Upgrade to Flex Pro for $12/month? This will simulate a purchase in your browser.');
        if (!ok) {
          addMessage('bot', 'Purchase cancelled.');
          return;
        }

        // Simulate success
        isPro = true;
        try { localStorage.setItem('flexai_isPro', '1'); } catch (e) {}
        refreshProUI();
        addMessage('bot', 'Thanks — you are now Flex Pro! ✦ All Pro-only features are unlocked (simulated).');
      }

      upgradeBtn.addEventListener('click', () => purchasePro());

      // Initialize
      initProState();
      addMessage('bot', 'Hi! I\'m Flex AI. Ask me anything — and for 1 + 1, the correct answer is 2! 🔢');
    </script>
  </body>
</html>
