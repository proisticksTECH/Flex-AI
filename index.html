<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex AI</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --panel-2: #f0f2f7;
        --accent: #f5c518;
        --accent-dark: #dca800;
        --text: #15181f;
        --muted: #667085;
        --border: #e6e8ef;
        --user: #111827;
        --bot: #f7f7f7;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #fffef7 0%, #f6f7fb 100%);
        color: var(--text);
      }

      .app {
        max-width: 820px;
        margin: 40px auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(17, 24, 39, 0.08);
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        background: #fffdf7;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #000;
        font-weight: 800;
      }

      .status {
        padding: 6px 10px;
        border-radius: 999px;
        background: #fef3c7;
        color: #92400e;
        font-size: 12px;
        font-weight: 700;
      }

      .chat {
        height: 480px;
        overflow-y: auto;
        background: var(--bg);
        padding: 20px;
      }

      .message {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .avatar.bot {
        background: var(--accent);
        color: #000;
      }

      .avatar.user {
        background: #111827;
        color: #fff;
      }

      .bubble {
        max-width: 70%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .message.bot .bubble {
        background: var(--bot);
        border: 1px solid var(--border);
      }

      .message.user .bubble {
        background: var(--user);
        color: white;
      }

      .composer {
        display: flex;
        gap: 10px;
        padding: 16px 20px 20px;
        background: #fff;
        border-top: 1px solid var(--border);
      }

      input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent-dark);
        box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 0 18px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: #000;
      }

      button:hover {
        background: #ffd234;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="brand">
          <div class="brand-mark">F</div>
          <span>Flex AI</span>
        </div>
        <div class="status">Online</div>
      </div>

      <div class="chat" id="chat"></div>

      <form class="composer" id="composer">
        <input id="question" type="text" placeholder="Ask Flex AI anything..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const questionInput = document.getElementById('question');
      const composer = document.getElementById('composer');

      function addMessage(role, text) {
        const row = document.createElement('div');
        row.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = `avatar ${role}`;
        avatar.textContent = role === 'bot' ? 'F' : 'U';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        if (role === 'user') {
          row.appendChild(bubble);
          row.appendChild(avatar);
        } else {
          row.appendChild(avatar);
          row.appendChild(bubble);
        }

        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
      }

      function getAnswer(input) {
        const text = input.trim();
        if (!text) return 'Ask me anything.';

        const normalized = text.toLowerCase().replace(/\s+/g, ' ').replace(/\?/g, '').trim();
        const isSimpleMath = /(^(what'?s?|what is|whats|what\s+is|what\s+are)?\s*1\s*(?:\+|plus)\s*1$)|(^1\s*(?:\+|plus)\s*1\s*=*$)|(^1\s*\+\s*1$)/.test(normalized);

        if (isSimpleMath) {
          return 'The answer is 2! 🔢';
        }

        if (/\b1\s*(?:\+|plus)\s*1\b/.test(normalized)) {
          return 'The answer is 2! 🔢';
        }

        return 'I can help with questions and explanations. For 1 + 1, the answer is 2! 🔢';
      }

      composer.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = questionInput.value.trim();
        if (!value) return;

        addMessage('user', value);
        addMessage('bot', getAnswer(value));
        questionInput.value = '';
      });

      addMessage('bot', 'Hi! I\'m Flex AI. Ask me anything — and for 1 + 1, the correct answer is 2! 🔢');
    </script>
  </body>
</html>
